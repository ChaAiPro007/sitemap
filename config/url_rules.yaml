# URL关键词提取规则配置

rules:
  # 特殊规则 - magicstudio.com (URL以/结尾)
  - domain: "magicstudio.com"
    description: "MagicStudio网站规则 - URL以斜杠结尾"
    patterns:
      - ".*"  # 匹配所有路径
    extract_rules:
      - type: "path_segment"
        position: -1  # 最后一个路径段
        split_chars: "-_"
        clean_regex: "[^a-zA-Z0-9 ]"  # 保留字母、数字和空格
    exclude_patterns:
      - ".*/sitemap.*"
      - ".*/robots.*"
      - ".*/api/.*"
      - ".*/admin/.*"
      - ".*/blog/.*"
      - ".*/blogs/.*"
      - ".*/m/.*"  # 排除移动版路径
      - ".*/reviews/.*"  # 排除评论页面
      - ".*/affiliates/.*"  # 排除联盟页面
      - ".*/pricing.*"  # 排除价格页面
      - ".*/changelog.*"  # 排除更新日志页面
      # 注意：不包含 ".*/$" 规则，允许以/结尾的URL
    stop_words: []

