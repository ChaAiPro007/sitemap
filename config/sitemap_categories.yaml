# Sitemap分类配置文件
# 用于自动识别sitemap属于游戏(game)还是工具(tool)类别

categories:
  game:
    # 精确域名匹配（最高优先级）
    exact_domains:
      - "itch.io"
      - "store.steampowered.com"
      - "www.epicgames.com"
      - "www.roblox.com"
      - "minecraft.net"
      - "www.kongregate.com"
      - "www.miniclip.com"
      - "poki.com"
      - "www.poki.com"
      - "crazygames.com"
      - "www.crazygames.com"
      - "y8.com"
      - "www.y8.com"
      - "armor games.com"
      - "www.newgrounds.com"
      - "gamejolt.com"
      - "www.addictinggames.com"
    
    # 域名模式匹配（正则表达式）
    domain_patterns:
      - ".*game.*"
      - ".*play.*"
      - ".*gaming.*"
      - ".*arcade.*"
      - ".*casino.*"
      - ".*poker.*"
      - ".*slots.*"
      - ".*bet.*"
    
    # URL路径模式匹配
    path_patterns:
      - ".*/games/.*"
      - ".*/play/.*"
      - ".*/arcade/.*"
      - ".*/game/.*"
      - ".*/gaming/.*"
    
    # 关键词特征（用于内容推断）
    keywords:
      - "gameplay"
      - "multiplayer"
      - "singleplayer"
      - "level"
      - "score"
      - "achievement"
      - "leaderboard"
      - "quest"
      - "boss"
      - "puzzle"
      - "rpg"
      - "fps"
      - "mmorpg"
      
  tool:
    # 精确域名匹配（包含所有37个已测试的工具网站）
    exact_domains:
      # AI图像和设计工具
      - "pixelcut.ai"
      - "www.pixelcut.ai"
      - "canva.com"
      - "www.canva.com"
      - "fotor.com"
      - "www.fotor.com"
      - "freepik.es"
      - "www.freepik.es"
      - "aragon.ai"
      - "www.aragon.ai"
      - "insmind.com"
      - "www.insmind.com"
      - "fluxpro.ai"
      - "www.fluxpro.ai"
      - "fluxproweb.com"
      - "airbrush.com"
      - "cutout.pro"
      - "www.cutout.pro"
      - "pollo.ai"
      - "logoai.com"
      - "www.logoai.com"
      - "stockimg.ai"
      - "getimg.ai"
      - "flair.ai"
      - "media.io"
      - "www.media.io"
      - "chromastudio.ai"
      - "www.chromastudio.ai"
      - "fal.ai"
      - "venngage.com"
      - "www.venngage.com"
      - "monica.im"
      - "visme.co"
      - "www.visme.co"
      - "looka.com"
      - "appointo.me"
      - "www.appointo.me"
      - "pica-ai.com"
      - "photoroom.com"
      - "magicstudio.com"
      - "imgupscaler.com"
      - "clipfly.ai"
      - "www.clipfly.ai"
      - "heygen.com"
      - "www.heygen.com"
      - "fliki.ai"
      - "imgkits.com"
      - "www.imgkits.com"
      - "imglarger.com"
      - "higgsfield.cc"
      - "imagine.art"
      - "www.imagine.art"
      - "unrealspeech.com"
    
    # 域名模式匹配
    domain_patterns:
      - ".*\\.ai$"           # 所有.ai结尾的域名
      - ".*tool.*"           # 包含tool的域名
      - ".*app.*"            # 包含app的域名
      - ".*studio.*"         # 包含studio的域名
      - ".*editor.*"         # 包含editor的域名
      - ".*design.*"         # 包含design的域名
      - ".*create.*"         # 包含create的域名
      - ".*maker.*"          # 包含maker的域名
      - ".*generator.*"      # 包含generator的域名
      - ".*converter.*"      # 包含converter的域名
    
    # URL路径模式匹配
    path_patterns:
      - ".*/tools/.*"
      - ".*/apps/.*"
      - ".*/editor/.*"
      - ".*/create/.*"
      - ".*/design/.*"
      - ".*/templates/.*"
      - ".*/generators/.*"
    
    # 关键词特征
    keywords:
      - "editor"
      - "converter"
      - "generator"
      - "optimizer"
      - "enhancer"
      - "remover"
      - "upscaler"
      - "template"
      - "design"
      - "create"
      - "edit"
      - "tool"
      - "app"
      - "ai"
      - "photo"
      - "image"
      - "video"
      - "audio"

# 默认分类（当无法判断时使用）
default_category: "tool"

# 分类策略优先级（从高到低）
priority_order:
  - "exact_domains"      # 精确匹配优先级最高
  - "domain_patterns"    # 域名模式次之
  - "path_patterns"      # 路径模式再次
  - "keywords"           # 关键词推断最低

# 配置选项
options:
  case_sensitive: false  # 域名匹配是否区分大小写
  log_classification: true  # 是否记录分类决策日志
  cache_results: true    # 是否缓存分类结果